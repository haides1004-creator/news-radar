name: Build AdShield APK

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "AdShieldBrowser/**"
      - ".github/workflows/adshield-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Security audit
        working-directory: AdShieldBrowser
        run: python3 tools/security_audit.py

      - name: Build debug APK
        working-directory: AdShieldBrowser
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp AdShieldBrowser/app/build/outputs/apk/debug/app-debug.apk AdShieldBrowser-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdShieldBrowser-v1.0.0
          path: AdShieldBrowser-v1.0.0.apk
          if-no-files-found: error
